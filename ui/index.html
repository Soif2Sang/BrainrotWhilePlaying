<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BrainrotWhilePlaying — Réglages</title><link rel="icon" href="logo.png"><link rel="stylesheet" href="settings.css"><script src="settings.js" defer></script></head>
<body><div id="toolbar"><button id="drag-handle" title="BrainrotWhilePlaying — Glisser pour déplacer" aria-label="Déplacer la fenêtre"><img src="logo.png" alt=""> ⠿</button><span id="toolbar-listening">⌨ Pavé actif</span></div><main>
  <header><span class="brand" id="panel-drag" title="BrainrotWhilePlaying — Glisser pour déplacer"><img src="logo.png" alt="Tung Tung Tung Sahur"><span class="brand-name">BrainrotWhilePlaying</span></span><span id="listening" role="status">⌨ Pavé actif</span><button id="close" aria-label="Masquer le panneau">×</button></header>
  <section class="heading"><span class="eyebrow">À TA FAÇON</span><h1>Les commandes.</h1><p>Clique sur une touche, puis appuie sur le raccourci que tu veux utiliser.</p></section>
  <button class="mode" id="mode"><span><i></i> Mode interaction</span><span>Reprendre le jeu ↗</span></button>
  <div id="bindings" aria-label="Raccourcis clavier"></div>
  <div id="capture" hidden role="status"><strong>Appuie sur une touche…</strong><span>Les raccourcis sont suspendus pendant la saisie.</span><button id="cancel">Annuler · Échap</button></div>
  <p id="message" role="status" aria-live="polite"></p>
  <footer><button id="reset">Réinitialiser</button><button id="save" class="primary" disabled>Enregistrer</button></footer>
  <p class="note" id="hint">Verr Num activé · Tu peux aussi utiliser des combinaisons de touches.</p>
</main></body></html>
