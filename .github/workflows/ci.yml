name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Check and build Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Rust toolchain
        run: rustup show
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check ui/settings.js
          node --check tests/player.test.cjs
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test player commands
        run: npm test
      - name: Test shortcut validation
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Lint Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Build portable executable
        run: npm run build
      - name: Package executable with license notices
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item src-tauri/target/release/brainrotwhileplaying.exe dist/
          Copy-Item LICENSE,NOTICE.md,README.md dist/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: BrainrotWhilePlaying-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
